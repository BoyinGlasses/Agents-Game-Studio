[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-game-studio"
version = "2.0.0"
description = "Agents Game Studio (AGS) v2: multi-harness game development framework with deterministic verification, hooks, and engine adapters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ags = "ags.__main__:main"

[tool.setuptools]
packages = ["ags", "ags.adapters", "ags._core"]
include-package-data = false

[tool.setuptools.package-dir]
"ags" = "ags"
"ags.adapters" = "ags/adapters"
"ags._core" = "core"

[tool.setuptools.package-data]
"ags._core" = ["*", "*/*", "*/*/*", "*/*/*/*", "*/*/*/*/*"]
